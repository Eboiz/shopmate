name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next typegen` and imports don't fail; tests don't hit Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Runs the seed script with plain Node, which also catches imports Vitest and tsc accept but Node can't run.
      - run: pnpm db:seed --check
      - run: pnpm db:seed --check --data=may-boutique

  # pgTAP tests (supabase/tests): schema, RLS between shops, constraints. Runs every
  # migration on a throwaway Supabase first, so a broken migration fails here too.
  # Then the integration tests (src/**/*.int.test.ts) against the same database.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime
      # Local keys only (printed by `supabase status`); they never leave the runner.
      - name: Export local Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm db:test
      - run: pnpm test:int

  # Python embedder tests (PB-30): formatting + in-memory Qdrant vectors.
  # Tests never load the real model; CPU-only torch keeps the install small.
  embedder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest -q
