name: E2E test agent

# After each scheduled nightly E2E run on main, a Claude Code agent reads what merged
# in the last 24 hours and writes Playwright tests for the new behavior (turning the
# fixme cases in e2e/backlog.spec.ts into real tests when their story has merged).
# A person reviews the PR; nothing is merged automatically.
#
# Three jobs, three machines:
#   agent      has the API key, runs nothing but the agent (no shell, reads only the
#              workspace, writes only e2e/), scans its output for the key, and hands
#              on a patch of e2e/ only;
#   run-tests  never sees the key: applies the patch and runs the suite on a
#              throwaway stack;
#   open-pr    the only job with a write token: opens the PR, runs no code from it.
on:
  workflow_run:
    workflows: [E2E nightly]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-agent
  cancel-in-progress: false

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: false
      - name: What merged in the last 24 hours (inside the workspace, where the agent may read)
        id: changes
        run: |
          git log --since='24 hours ago' --stat -p -- src supabase > recent-changes.diff
          [ -s recent-changes.diff ] || echo "none=true" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.none != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write tests with Claude Code
        if: steps.changes.outputs.none != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "$(cat .github/e2e-agent-prompt.md)" \
            --model claude-sonnet-5-5 \
            --allowedTools "Read(./**),Glob,Grep,Edit(./e2e/**),Write(./e2e/**),Write(./e2e-agent-summary.md)" \
            --disallowedTools "Bash,WebFetch,WebSearch,Read(//proc/**),Read(//etc/**),Read(~/**)"
      - name: Package e2e/ only
        id: patch
        if: steps.changes.outputs.none != 'true'
        run: |
          git add -N e2e
          git diff -- e2e > e2e.patch
          cp e2e-agent-summary.md summary.md 2>/dev/null || echo "Agent viết test e2e cho các thay đổi đã merge trong 24 giờ qua." > summary.md
          [ -s e2e.patch ] && echo "changed=true" >> "$GITHUB_OUTPUT" || true
      # Fail closed before anything the agent wrote leaves this machine or runs anywhere.
      - name: Refuse output that contains the API key
        if: steps.patch.outputs.changed == 'true'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          leak=false
          grep -qE 'sk-ant-[A-Za-z0-9_-]{8,}' e2e.patch summary.md && leak=true
          if [ -n "$KEY" ]; then
            grep -qF "$KEY" e2e.patch summary.md && leak=true
            for pad in "" "x" "xx"; do
              enc=$(printf '%s%s' "$pad" "$KEY" | base64 -w0 | cut -c5-40)
              grep -qF "$enc" e2e.patch summary.md && leak=true
            done
          fi
          if [ "$leak" = true ]; then echo "::error::Agent output contains the API key. Rotate the key."; exit 1; fi
      - if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-patch
          path: |
            e2e.patch
            summary.md
          retention-days: 7

  run-tests:
    needs: agent
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      DEMO_OWNER_EMAIL: owner@shopmate.test
      DEMO_OWNER_PASSWORD: e2e-owner-password
      DEMO_STAFF_EMAIL: staff@shopmate.test
      DEMO_STAFF_PASSWORD: e2e-staff-password
      META_APP_SECRET: e2e-app-secret
      META_VERIFY_TOKEN: e2e-verify-token
      MESSENGER_PAGE_ID: "100000000000001"
      MESSENGER_PAGE_ACCESS_TOKEN: e2e-page-token
      TELEGRAM_BOT_TOKEN: "100000001:e2e-bot-token"
      TELEGRAM_WEBHOOK_SECRET: e2e_telegram_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: e2e-agent-patch
          path: ${{ runner.temp }}/agent
      - name: Apply the patch (e2e/ only)
        run: |
          patch="$RUNNER_TEMP/agent/e2e.patch"
          if grep -E '^(\+\+\+|---) [ab]/' "$patch" | grep -vE '^(\+\+\+|---) [ab]/e2e/' | grep -q .; then
            echo "The patch touches files outside e2e/; refusing." && exit 1
          fi
          git apply --include='e2e/*' "$patch"
      - uses: ./.github/actions/local-stack
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the suite
        continue-on-error: true
        run: pnpm exec playwright test --reporter=list > e2e-result.txt 2>&1
      - name: PR description (counts only; the full log stays in the artifact)
        run: |
          { cat "$RUNNER_TEMP/agent/summary.md"
            echo; echo "## Kết quả chạy trên stack tạm"
            grep -oE '[0-9]+ (passed|failed|flaky|skipped)' e2e-result.txt | sed 's/^/- /'
            echo; echo "PR do workflow mở nên GitHub không tự chạy CI: push một commit bất kỳ lên nhánh này (hoặc đóng rồi mở lại) để chạy CI trước khi merge."
          } > pr-body.md
          cp "$RUNNER_TEMP/agent/e2e.patch" e2e.patch
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-pr
          path: |
            e2e.patch
            pr-body.md
            e2e-result.txt
          retention-days: 7

  open-pr:
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: e2e-agent-pr
          path: ${{ runner.temp }}/agent
      - name: Commit e2e/ and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          patch="$RUNNER_TEMP/agent/e2e.patch"
          if grep -E '^(\+\+\+|---) [ab]/' "$patch" | grep -vE '^(\+\+\+|---) [ab]/e2e/' | grep -q .; then
            echo "The patch touches files outside e2e/; refusing." && exit 1
          fi
          git apply --include='e2e/*' "$patch"
          branch="e2e-agent/$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git config user.name "shopmate-e2e-agent"
          git config user.email "e2e-agent@users.noreply.github.com"
          git add e2e
          git commit -m "E2E: test tự động cho thay đổi ngày $(date -u +%d/%m/%Y)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "E2E: test tự động ngày $(date -u +%d/%m/%Y)" \
            --body-file "$RUNNER_TEMP/agent/pr-body.md"
